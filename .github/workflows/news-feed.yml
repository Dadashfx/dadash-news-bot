name: Dadash Nyhedsfeed

on:
  schedule:
    - cron: "*/5 * * * *"      # hvert 5. minut
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent og post nyheder
        env:
          DISCORD_FEED_WEBHOOK_URL: ${{ secrets.DISCORD_FEED_WEBHOOK_URL }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python news_feed.py

      - name: Gem hvad der er postet
        run: |
          git config user.name "dadash-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed_state.json
          git diff --cached --quiet && exit 0
          git commit -m "feed: opdater state"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
